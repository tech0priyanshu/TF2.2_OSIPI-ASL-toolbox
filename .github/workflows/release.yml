name: Build & Release PyASL Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test Suite Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        working-directory: PyASL
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,pipeline]"

      - name: Run pytest
        working-directory: PyASL
        run: pytest tests/ -v --tb=short

  build-windows:
    name: Build Windows Release
    needs: [test]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: PyASL
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -e ".[gui,pipeline]"

      - name: Build Windows release
        working-directory: PyASL
        run: python tools/build.py

      - name: Post-build smoke test
        working-directory: PyASL
        run: |
          ./dist/PyASL-GUI/PyASL-GUI.exe --version || python launch_gui.py --help

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: PyASL/release/PyASL-v*-Windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS Release
    needs: [test]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: PyASL
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -e ".[gui,pipeline]"

      - name: Build macOS release
        working-directory: PyASL
        run: python tools/build.py

      - name: Post-build smoke test
        working-directory: PyASL
        run: |
          ./dist/PyASL-GUI.app/Contents/MacOS/PyASL-GUI --help || python launch_gui.py --help

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: PyASL/release/PyASL-v*-macOS-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux Release
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: PyASL
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -e ".[gui,pipeline]"

      - name: Build Linux release
        working-directory: PyASL
        run: python tools/build.py

      - name: Post-build smoke test
        working-directory: PyASL
        run: |
          ./dist/PyASL-GUI/PyASL-GUI --help || python launch_gui.py --help

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: PyASL/release/PyASL-v*-Linux-x64.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
